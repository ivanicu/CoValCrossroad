<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoVal Crossroad — the whole object</title>
<style>
:root{
  --bg:#14151c; --bg2:#191a23; --bg3:#1e1f2a; --line:#292b37; --line2:#343646;
  --fg:#c0caf5; --dim:#7f88a8; --dimmer:#565d78;
  --gold:#e0af68; --red:#f7768e; --green:#9ece6a; --blue:#7aa2f7; --violet:#bb9af7; --orange:#ff9e64;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
body{padding:0 0 6rem}
.wrap{max-width:1500px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--gold)}
code,.m{font-family:var(--mono);font-size:.86em}
header{border-bottom:1px solid var(--line);padding:48px 0 34px}
header .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
header h1{font-size:44px;line-height:1.05;margin-bottom:12px}
header h1 em{font-style:normal;color:var(--gold)}
header p.lede{color:var(--dim);max-width:76ch;font-size:15.5px;margin:0 0 24px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.counts div{background:var(--bg2);padding:12px 13px}
.counts b{display:block;font-family:var(--mono);font-size:22px;color:var(--gold);line-height:1.2}
.counts span{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
section{padding:46px 0;border-bottom:1px solid var(--line)}
.shead{display:flex;align-items:baseline;gap:13px;margin-bottom:7px}
.snum{font-family:var(--mono);font-size:12px;color:var(--gold);border:1px solid var(--gold);padding:2px 7px;flex:none}
.shead h2{font-size:25px}
.sub{color:var(--dim);max-width:92ch;margin:0 0 22px;font-size:14.5px}
.sub b{color:var(--fg);font-weight:600} .sub .hot{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--line);padding:15px 17px}
.card h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--dim);margin-bottom:11px;font-weight:600}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th{text-align:left;color:var(--dim);font-weight:500;border-bottom:1px solid var(--line);padding:5px 8px 5px 0;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
td{padding:4px 8px 4px 0;border-bottom:1px solid #212330;vertical-align:top}
tr:hover td{background:#1d1e29}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
button{font-family:var(--mono);font-size:11.5px;background:var(--bg3);color:var(--dim);border:1px solid var(--line);padding:5px 9px;cursor:pointer;transition:.12s}
button:hover{color:var(--fg);border-color:var(--line2)}
button.on{background:var(--gold);color:#14151c;border-color:var(--gold);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btns .lbl{font-family:var(--mono);font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.1em;margin-right:2px}
.bar{height:9px;display:block;background:var(--gold)}
.barwrap{background:#23252f;height:9px;width:100%}
svg{display:block;max-width:100%}
text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
.gridline{stroke:#212330}
.note{border-left:2px solid var(--gold);padding:10px 0 10px 14px;margin:18px 0;color:var(--dim);font-size:13.5px;background:#1a1b25}
.note b{color:var(--gold)}
.warn{border-left-color:var(--red)} .warn b{color:var(--red)}
.pos{color:var(--green)} .neg{color:var(--red)} .gold{color:var(--gold)}
.b-neg{background:rgba(247,118,142,.13)}
.mono-sm{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:pre-wrap;line-height:1.55}
.prov{font-family:var(--mono);font-size:10px;color:var(--dimmer);margin-top:9px}
footer{padding:40px 0;color:var(--dimmer);font-size:12px;font-family:var(--mono)}
.zh2{display:block;color:var(--dim);font-size:.94em;margin-top:2px;opacity:.88}
.counts .zh2,.legend .zh2,td .zh2{display:inline;margin-left:6px;font-size:.9em}
#langsw{position:fixed;top:12px;right:14px;z-index:200;display:flex;gap:4px;background:rgba(20,21,28,.94);border:1px solid var(--line);padding:4px}
#langsw button{font-size:11px;padding:3px 9px}

/* ---- cloud ---- */
#cloudwrap{position:relative;background:#101118;border:1px solid var(--line)}
#cloud{display:block;width:100%;cursor:crosshair}
#tip{position:absolute;pointer-events:none;background:#0d0e14;border:1px solid var(--gold);
  padding:7px 10px;font-family:var(--mono);font-size:11px;max-width:390px;color:var(--fg);
  display:none;z-index:20;line-height:1.45;box-shadow:0 6px 22px rgba(0,0,0,.6)}
#tip .t{color:var(--gold);font-size:10px;text-transform:uppercase;letter-spacing:.1em;display:block;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.legend div{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border:1px solid var(--line);cursor:pointer;opacity:.55}
.legend div.on{opacity:1;border-color:currentColor}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:currentColor}

/* ---- drawer ---- */
#drawer{position:fixed;top:0;right:0;width:min(760px,94vw);height:100vh;background:var(--bg2);
  border-left:1px solid var(--gold);overflow-y:auto;transform:translateX(102%);transition:transform .22s;z-index:100;
  box-shadow:-18px 0 50px rgba(0,0,0,.55)}
#drawer.open{transform:none}
#drawer .dh{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--line);
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
#drawer .dh b{color:var(--gold);font-family:var(--mono);font-size:12px}
#drawer .body{padding:18px 20px 80px}
#drawer h4{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);
  margin:22px 0 9px;border-bottom:1px solid var(--line);padding-bottom:5px;font-weight:600}
#drawer h4:first-child{margin-top:0}
.q{background:var(--bg3);border-left:2px solid var(--gold);padding:11px 13px;font-size:14px;color:var(--fg)}
.rsp{border:1px solid var(--line);background:var(--bg3);padding:10px 12px;margin-bottom:9px}
.rsp .lab{font-family:var(--mono);font-size:19px;color:var(--gold);float:left;margin:-1px 11px 4px 0;line-height:1}
.rsp .txt{font-size:12.5px;color:var(--dim);line-height:1.5;white-space:pre-wrap}
.ann{border:1px solid var(--line);padding:9px 11px;margin-bottom:7px;font-size:12px}
.ann .hd{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:5px}
.ann .why{color:var(--dimmer);font-size:11.5px;line-height:1.5;margin-top:4px}
.ann.split{border-color:var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--mono);font-size:11.5px}
.kv b{color:var(--dim);font-weight:400}
#searchbox{background:var(--bg3);border:1px solid var(--line);color:var(--fg);font-family:var(--mono);
  font-size:12px;padding:6px 10px;width:290px}
</style></head><body>

<script src="i18n.js"></script>
<script>
const $=s=>document.querySelector(s), EL=(t,a={},...c)=>{const e=document.createElement(t);
 for(const k in a){if(k==='class')e.className=a[k];else if(k==='html')e.innerHTML=a[k];else e.setAttribute(k,a[k]);}
 c.flat().filter(x=>x!=null).forEach(x=>e.appendChild(typeof x==='string'?document.createTextNode(x):x));return e;};
const f=(x,n=4)=>x==null?'—':(+x).toFixed(n), pct=x=>x==null?'—':(100*x).toFixed(1)+'%';
const NS='http://www.w3.org/2000/svg', S=(t,a={})=>{const e=document.createElementNS(NS,t);
 for(const k in a)e.setAttribute(k,a[k]);return e;};
const svg=(w,h)=>S('svg',{viewBox:`0 0 ${w} ${h}`,width:'100%'});
function txt(s,x,y,t,a={}){const e=S('text',Object.assign({x,y},a));e.textContent=t;s.appendChild(e);return e;}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const CL=['#e0af68','#7aa2f7','#9ece6a','#bb9af7','#ff9e64','#f7768e','#73daca','#c0caf5',
          '#b48ead','#a3be8c','#d08770','#88c0d0'];

let P,C,HUE='cluster',SIZE='n_crit',PROJ='tsne',LAYER=null,LSET=null,ACTIVE=new Set(),QUERY='';
function applyI18N(root){
  (root||document).querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=T(e.dataset.t);});
  (root||document).querySelectorAll('[data-tph]').forEach(e=>{e.placeholder=Tt(e.dataset.tph);});}
function buildLangSwitch(){const h=$('#langsw');h.innerHTML='';
  LANGS.forEach(L=>{const b=EL('button',{},LANGNAME[L]);b.className=(L===LANG)?'on':'';
    b.onclick=()=>{LANG=L;localStorage.setItem('atlas_lang',L);location.reload();};h.appendChild(b);});}
Promise.all([fetch('payload.json').then(r=>r.json()),fetch('corpus.json').then(r=>r.json())])
 .then(([p,c])=>{P=p;C=c;buildLangSwitch();applyI18N();draw();});

/* ================= drawer ================= */
function closeDrawer(){$('#drawer').classList.remove('open');}
async function openPrompt(pid){
  const d=$('#drawer'),b=$('#dbody');
  $('#dtitle').textContent=pid; b.innerHTML='<p class="mono-sm">'+Tt('d.loading')+'</p>'; d.classList.add('open');
  const x=await fetch('p/'+pid+'.json').then(r=>r.json());
  const row=C.rows.find(r=>r.pid===pid)||{};
  const cl=C.clusters[row.cluster]||{};
  const PAIRS=['AB','AC','AD','BC','BD','CD'];
  let h='';
  h+='<h4>'+T('d.prompt')+'</h4>';
  if(x.developer)h+=`<p class="mono-sm">${Tt('d.dev')} ${esc(x.developer)}</p>`;
  h+=`<div class="q">${esc(x.user)}</div>`;
  if(x.prior_assistant&&x.prior_assistant.length)
    h+=`<p class="mono-sm" style="margin-top:8px">${Tt('d.prior')} ${esc(x.prior_assistant.join(' … ')).slice(0,600)}</p>`;
  h+=`<div class="kv" style="margin-top:11px">
    <b>${Tt('d.neigh')}</b><span style="color:${CL[row.cluster%12]}">c${row.cluster} · ${esc(cl.label||'')}</span>
    <b>${Tt('d.nann')}</b><span>${x.assessments.length}</span>
    <b>${Tt('d.ncrit')}</b><span>${x.criteria.length}</span>
    <b>${Tt('d.turns')}</b><span>${x.n_turns}</span>
    <b>${Tt('d.modal')}</b><span>${x.target?x.target.map((v,i)=>PAIRS[i]+(v>0?'+':v<0?'−':'=')).join(' '):'—'} ${x.target_tie?'<b style="color:var(--red)">'+Tt('d.tie')+'</b>':''}</span>
    <b>${Tt('d.cons')}</b><span>${f(x.consensus,3)}</span>
    <b>${Tt('d.split')}</b><span>${x.personal_world_splits} ${Tt('d.of')} ${x.assessments.length}</span></div>`;

  h+='<h4>'+T('d.four')+'</h4>';
  x.responses.forEach(r=>{h+=`<div class="rsp"><span class="lab">${r.label}</span><div class="txt">${esc(r.text)}</div></div>`;});

  h+='<h4>'+T('d.rubric')+'</h4>';
  h+='<table><tr><th>#</th><th>w</th><th>n</th><th>A</th><th>B</th><th>C</th><th>D</th><th>criterion</th></tr>';
  x.criteria.slice().sort((a,b)=>b.w-a.w).forEach(c=>{
    h+=`<tr class="${c.w<0?'b-neg':''}"><td class="num">${c.i}</td>
     <td class="num ${c.w<0?'neg':'pos'}" title="${c.scores.join(', ')}">${f(c.w,2)}</td>
     <td class="num">${c.n}</td>`+
     c.sat.map(v=>`<td class="num">${v==null?'—':f(v,3)}</td>`).join('')+
     `<td>${esc(c.text)}</td></tr>`;});
  h+='</table>';

  if(x.coval_core.length){h+='<h4>'+T('d.core')+'</h4><table>';
    x.coval_core.forEach((t,i)=>{h+=`<tr><td class="num">${i}</td>
      <td style="color:${x.core_in_full[i]?'var(--green)':'var(--red)'};white-space:nowrap">${x.core_in_full[i]?Tt('d.infull'):Tt('d.notin')}</td>
      <td>${esc(t)}</td></tr>`;});h+='</table>';}

  if(Object.keys(x.verdicts||{}).length){h+='<h4>'+T('d.verd')+'</h4><table>';
    Object.entries(x.verdicts).forEach(([k,v])=>{h+=`<tr><td>${k}</td><td class="num" style="color:${v>=4?'var(--green)':v<=1?'var(--red)':'var(--gold)'}">${v}/6</td></tr>`;});
    h+='</table>';}

  h+='<h4>'+T('d.rate')+'</h4><div class="kv">';
  [[Tt('d.imp'),x.importance],[Tt('d.rep'),x.representativeness],[Tt('d.subj'),x.subjectivity]]
   .forEach(([k,v])=>{h+=`<b>${k}</b><span>${v.map(z=>esc(String(z[0])).slice(0,58)+' ×'+z[1]).join('<br>')}</span>`;});
  h+='</div>';

  h+='<h4>'+T('d.world')+'</h4><div class="kv">';
  x.world_rankings.forEach(([r,n])=>{h+=`<b>${esc(r)}</b><span>×${n}</span>`;});h+='</div>';
  h+='<h4>'+T('d.pers')+'</h4><div class="kv">';

function hueOf(r){
  if(HUE==='cluster')return CL[r.cluster%12];
  if(HUE==='tie')return r.tie?'#f7768e':'#3b4059';
  if(HUE==='has_rubric')return r.has_rubric?'#9ece6a':'#f7768e';
  const [lo,hi]=hueOf.rg[HUE]||[0,1],v=+r[HUE];
  if(v==null||isNaN(v))return '#3b4059';
  const u=hi>lo?(v-lo)/(hi-lo):.5;
  const a=[224,175,104],b=[122,162,247];

function paint(){
  ctx.clearRect(0,0,W_,H_);
  const pad=26,[slo,shi]=szrg[SIZE];XY=[];
  const px='x_'+PROJ, py='y_'+PROJ, LC=LAYER?LAYER.colour:null;
  ctx.strokeStyle='#1c1e2a';ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const y=pad+g*(H_-2*pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W_-pad,y);ctx.stroke();}
  const draw=[];
  pts.forEach(r=>{
    const x=pad+(r[px]??r.x)*(W_-2*pad), y=pad+(1-(r[py]??r.y))*(H_-2*pad);
    const v=+r[SIZE], u=shi>slo?((isNaN(v)?slo:v)-slo)/(shi-slo):.5;
    const rad=PROJ==='grid'?4.4:2.2+Math.sqrt(u)*7.5;
    const inL=LSET?LSET.has(r.pid):true;
    const on=ACTIVE.has(r.cluster)&&(!QUERY||r.title.toLowerCase().includes(QUERY));
    XY.push({x,y,rad,r,on:on&&inL});
    draw.push({x,y,rad,r,on,inL});});
  // background pass: everything not in the active layer
  draw.forEach(p=>{if(LSET&&p.inL)return;
    ctx.beginPath();ctx.arc(p.x,p.y,p.rad,0,6.284);
    ctx.fillStyle=LSET?'#3b4059':hueOf(p.r);
    ctx.globalAlpha=p.on?(LSET?.14:(QUERY?.95:.62)):.05;ctx.fill();
    if(p.on&&QUERY&&!LSET){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();}
    else if(p.on&&p.r.tie&&HUE!=='tie'&&!LSET){ctx.globalAlpha=.5;ctx.strokeStyle='#f7768e';ctx.lineWidth=1;ctx.stroke();}});
  // foreground pass: the layer, drawn last so it is never buried
  if(LSET)draw.forEach(p=>{if(!p.inL||!p.on)return;
    ctx.beginPath();ctx.arc(p.x,p.y,p.rad+1.4,0,6.284);
    ctx.fillStyle=LC;ctx.globalAlpha=.82;ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle=LC;ctx.lineWidth=1.1;ctx.stroke();});
  ctx.globalAlpha=1;
  if(HUE==='cluster'&&!LSET&&PROJ!=='swarm')C.clusters.forEach(c=>{if(!ACTIVE.has(c.id))return;

    H:(LSET?Tt('lay.on')+LB(LAYER):HUES[HUE]), Z:(PROJ==='grid'?Tt('grid.fix'):SIZES[SIZE])});}
